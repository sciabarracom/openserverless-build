name: Build Image

on:
  push:
    tags:
    - '*.*.*.*'
    branches-ignore:
    - '*'
  workflow_dispatch:
jobs:
  distdocker:
    name: Build OpenServerless OpenWhisk 2 based images
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check GHCR_TOKEN is set
        if: ${{ github.repository_owner != 'apache' }}
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            {
              echo "## Missing required secret: GHCR_TOKEN"
              echo
              echo "This repository publishes multiple images whose names do not"
              echo "match the repository (openwhisk2/controller, invoker,"
              echo "scheduler, standalone, scala). The built-in GITHUB_TOKEN only"
              echo "has write access to packages owned by this repository, so it"
              echo "cannot push them: the push would fail with"
              echo '`denied: permission_denied: write_package`.'
              echo
              echo "To fix this, create a Personal Access Token and add it as a secret:"
              echo
              echo "1. Go to https://github.com/settings/tokens"
              echo "   -> Generate new token (classic)"
              echo "2. Select the **write:packages** scope"
              echo "3. Copy the generated token"
              echo "4. In this repository go to"
              echo "   Settings -> Secrets and variables -> Actions -> New repository secret"
              echo "5. Name it exactly **GHCR_TOKEN** and paste the token as the value"
              echo
              echo "Then re-run this workflow. See BUILD.md section 2.6 for details."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing GHCR_TOKEN::This repository publishes multiple images and needs a PAT with write:packages stored as the secret GHCR_TOKEN. See the job summary or BUILD.md section 2.6 for step-by-step instructions."
            exit 1
          fi
      #- name: Remove unnecessary files
      #  run: |
      #    sudo rm -rf /usr/share/dotnet
      #    sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # full history and tags: "task tag" replaces the existing tags
          # and "git describe" needs them to be present
          fetch-depth: 0
      - name: License
        uses: apache/skywalking-eyes@v0.9.0
      - name: Setup CI
        run: bash .github/cisetup.sh
      # Manual run: create a new snapshot tag on the current HEAD and push it.
      # The push of the tag does not start another run (GITHUB_TOKEN pushes do
      # not trigger workflows), so this same run goes on and builds it.
      - name: Tag HEAD (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          task tag
          task ci
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Assign TAG from push
        run: echo "IMG_TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"
      - name: Use ghcr.io repo
        if:  ${{ github.repository_owner != 'apache'}}
        run: |
          echo "REPO_URL=ghcr.io" >> "$GITHUB_ENV"
          echo "DOCKER_REGISTRY=ghcr.io/${{ github.repository_owner }}" >> "$GITHUB_ENV"
      - name: Use docker.io
        if:  ${{ github.repository_owner == 'apache'}}
        run: |
          echo "REPO_URL=docker.io" >> "$GITHUB_ENV"
          echo "DOCKER_REGISTRY=docker.io/apache" >> "$GITHUB_ENV"
      # This repository publishes MULTIPLE images (openwhisk2/controller,
      # invoker, scheduler, standalone, scala) whose names do not match the
      # repository. GHCR grants the built-in GITHUB_TOKEN write access only to
      # packages owned by the repository running the workflow, so it cannot
      # create or update these. A PAT with write:packages is required instead.
      # Fail fast with instructions rather than after a long build.
      - name: Select registry credentials
        run: |
          if [ "${REPO_URL%%/*}" = "ghcr.io" ]; then
            echo "REGISTRY_USER=${{ github.actor }}" >> "$GITHUB_ENV"
            echo "REGISTRY_TOKEN=${{ secrets.GHCR_TOKEN }}" >> "$GITHUB_ENV"
          else
            echo "REGISTRY_USER=${{ secrets.DOCKERHUB_USER }}" >> "$GITHUB_ENV"
            echo "REGISTRY_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}" >> "$GITHUB_ENV"
          fi
      - name: Registry login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REPO_URL }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Dist Docker
        run: task buildx-and-push TAG="$IMG_TAG" DOCKER_REGISTRY="${{ env.DOCKER_REGISTRY }}"