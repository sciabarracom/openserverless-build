name: Build Image

on:
  push:
    tags:
    - '*.*.*.*'
    branches-ignore:
    - '*'
  workflow_dispatch:
jobs:
  distdocker:
    name: Build OpenServerless OpenWhisk 2 based images
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"    
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # full history and tags: "task tag" replaces the existing tags
          # and "git describe" needs them to be present
          fetch-depth: 0
      - name: License
        uses: apache/skywalking-eyes@v0.9.0
      - name: Setup CI
        run: bash .github/cisetup.sh                   
      # Manual run: create a new snapshot tag on the current HEAD and push it.
      # The push of the tag does not start another run (GITHUB_TOKEN pushes do
      # not trigger workflows), so this same run goes on and builds it.
      - name: Tag HEAD (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          task tag
          task ci
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'        
      - name: Assign TAG from pull request
        if:  ${{ github.event_name == 'pull_request' }}
        run: |
          echo "IMG_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Assign TAG from push
        if:  ${{ github.event_name != 'pull_request' }}
        run: |
          echo "IMG_TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"
      - name: Use ghcr.io repo
        if:  ${{ github.repository_owner != 'apache'}}
        run: |
          echo "REPO_URL=ghcr.io" >> "$GITHUB_ENV"
          echo "DOCKER_REGISTRY=ghcr.io/${{ github.repository_owner }}" >> "$GITHUB_ENV"
      - name: Use registry.hub.docker.com
        if:  ${{ github.repository_owner == 'apache'}}
        run: |
          echo "REPO_URL=registry.hub.docker.com" >> "$GITHUB_ENV"
          echo "DOCKER_REGISTRY=registry.hub.docker.com/apache" >> "$GITHUB_ENV"         
      - name: Select registry credentials
        run: |
          if [ "${REPO_URL%%/*}" = "ghcr.io" ]; then
            echo "REGISTRY_USER=${{ github.actor }}" >> "$GITHUB_ENV"
            echo "REGISTRY_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"
          else
            echo "REGISTRY_USER=${{ secrets.DOCKERHUB_USER }}" >> "$GITHUB_ENV"
            echo "REGISTRY_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}" >> "$GITHUB_ENV"
          fi
      - name: Registry login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REPO_URL }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Dist Docker
        run: task buildx-and-push TAG="$IMG_TAG" DOCKER_REGISTRY="${{ env.DOCKER_REGISTRY }}"